name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    name: linux
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: foton-handoff-src
    steps:
      - uses: actions/checkout@v7
      - name: install toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.0
          components: rustfmt, clippy
      - name: fmt
        run: cargo fmt --check
      - name: clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: unit tests
        run: cargo test
      - name: release build
        run: cargo build --release
      - name: e2e suite
        run: bash ../scripts/e2e-linux.sh ./target/release/foton-handoff
      - name: upload binary
        uses: actions/upload-artifact@v7
        with:
          name: foton-handoff-linux
          path: foton-handoff-src/target/release/foton-handoff
          if-no-files-found: error

  windows:
    name: windows
    runs-on: windows-latest
    defaults:
      run:
        working-directory: foton-handoff-src
    env:
      RUSTFLAGS: -C target-feature=+crt-static
    steps:
      - uses: actions/checkout@v7
      - name: install toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.0
          components: rustfmt, clippy
      - name: fmt
        run: cargo fmt --check
      - name: clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: unit tests
        run: cargo test
      - name: release build (static CRT)
        run: cargo build --release
      - name: static link check
        shell: pwsh
        run: |
          $exe = "target/release/foton-handoff.exe"
          $text = [Text.Encoding]::ASCII.GetString([IO.File]::ReadAllBytes($exe))
          $bad = @("VCRUNTIME140.dll", "MSVCP140.dll", "libgcc_s_seh-1.dll", "libwinpthread-1.dll") |
            Where-Object { $text.Contains($_) }
          if ($bad) {
            Write-Error ("dynamic runtime dependency found: " + ($bad -join ", "))
            exit 1
          }
          "no dynamic C/C++ runtime dependency in $exe"
      - name: e2e suite
        shell: pwsh
        run: ../scripts/e2e-windows.ps1 -Bin ./target/release/foton-handoff.exe
      - name: upload binary
        uses: actions/upload-artifact@v7
        with:
          name: foton-handoff-windows
          path: foton-handoff-src/target/release/foton-handoff.exe
          if-no-files-found: error

  linux-musl:
    name: linux-musl
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: foton-handoff-src
    steps:
      - uses: actions/checkout@v7
      - name: install toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.0
      - name: add musl target
        run: rustup target add x86_64-unknown-linux-musl
      - name: release build (static musl)
        run: cargo build --release --target x86_64-unknown-linux-musl
      - name: static link check
        run: |
          bin=target/x86_64-unknown-linux-musl/release/foton-handoff
          file "$bin"
          if readelf -l "$bin" | grep -q INTERP; then
            echo "dynamic interpreter present in $bin" >&2
            exit 1
          fi
          echo "no dynamic interpreter in $bin"
      - name: e2e suite
        run: bash ../scripts/e2e-linux.sh ./target/x86_64-unknown-linux-musl/release/foton-handoff
      - name: upload binary
        uses: actions/upload-artifact@v7
        with:
          name: foton-handoff-linux-musl
          path: foton-handoff-src/target/x86_64-unknown-linux-musl/release/foton-handoff
          if-no-files-found: error

  linux-musl-arm64:
    name: linux-musl-arm64
    runs-on: ubuntu-24.04-arm
    defaults:
      run:
        working-directory: foton-handoff-src
    steps:
      - uses: actions/checkout@v7
      - name: install toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.0
      - name: add musl target
        run: rustup target add aarch64-unknown-linux-musl
      - name: release build (static musl)
        run: cargo build --release --target aarch64-unknown-linux-musl
      - name: static link check
        run: |
          bin=target/aarch64-unknown-linux-musl/release/foton-handoff
          file "$bin"
          if readelf -l "$bin" | grep -q INTERP; then
            echo "dynamic interpreter present in $bin" >&2
            exit 1
          fi
          echo "no dynamic interpreter in $bin"
      - name: e2e suite
        run: bash ../scripts/e2e-linux.sh ./target/aarch64-unknown-linux-musl/release/foton-handoff
      - name: upload binary
        uses: actions/upload-artifact@v7
        with:
          name: foton-handoff-linux-arm64-musl
          path: foton-handoff-src/target/aarch64-unknown-linux-musl/release/foton-handoff
          if-no-files-found: error

  release:
    name: release
    needs: [linux, windows, linux-musl, linux-musl-arm64]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: download linux binary
        uses: actions/download-artifact@v8
        with:
          name: foton-handoff-linux
          path: dist/linux
      - name: download windows binary
        uses: actions/download-artifact@v8
        with:
          name: foton-handoff-windows
          path: dist/windows
      - name: download linux musl binary
        uses: actions/download-artifact@v8
        with:
          name: foton-handoff-linux-musl
          path: dist/linux-musl
      - name: download linux arm64 musl binary
        uses: actions/download-artifact@v8
        with:
          name: foton-handoff-linux-arm64-musl
          path: dist/linux-arm64-musl
      - name: publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mv dist/linux/foton-handoff dist/foton-handoff-linux
          mv dist/windows/foton-handoff.exe dist/foton-handoff-windows.exe
          mv dist/linux-musl/foton-handoff dist/foton-handoff-linux-musl
          mv dist/linux-arm64-musl/foton-handoff dist/foton-handoff-linux-arm64-musl
          chmod +x dist/foton-handoff-linux dist/foton-handoff-linux-musl dist/foton-handoff-linux-arm64-musl
          cd dist
          sha256sum foton-handoff-linux foton-handoff-windows.exe \
            foton-handoff-linux-musl foton-handoff-linux-arm64-musl > SHA256SUMS.txt
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$TAG" \
            --generate-notes \
            foton-handoff-linux foton-handoff-windows.exe \
            foton-handoff-linux-musl foton-handoff-linux-arm64-musl SHA256SUMS.txt
