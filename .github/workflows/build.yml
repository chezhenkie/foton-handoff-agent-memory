name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    name: linux
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: foton-handoff-src
    steps:
      - uses: actions/checkout@v4
      - name: install toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.0
          components: rustfmt, clippy
      - name: fmt
        run: cargo fmt --check
      - name: clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: unit tests
        run: cargo test
      - name: release build
        run: cargo build --release
      - name: e2e suite
        run: bash ../scripts/e2e-linux.sh ./target/release/foton-handoff
      - name: upload binary
        uses: actions/upload-artifact@v4
        with:
          name: foton-handoff-linux
          path: foton-handoff-src/target/release/foton-handoff
          if-no-files-found: error

  windows:
    name: windows
    runs-on: windows-latest
    defaults:
      run:
        working-directory: foton-handoff-src
    env:
      RUSTFLAGS: -C target-feature=+crt-static
    steps:
      - uses: actions/checkout@v4
      - name: install toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.0
          components: rustfmt, clippy
      - name: fmt
        run: cargo fmt --check
      - name: clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: unit tests
        run: cargo test
      - name: release build (static CRT)
        run: cargo build --release
      - name: static link check
        shell: pwsh
        run: |
          $exe = "target/release/foton-handoff.exe"
          $text = [Text.Encoding]::ASCII.GetString([IO.File]::ReadAllBytes($exe))
          $bad = @("VCRUNTIME140.dll", "MSVCP140.dll", "libgcc_s_seh-1.dll", "libwinpthread-1.dll") |
            Where-Object { $text.Contains($_) }
          if ($bad) {
            Write-Error ("dynamic runtime dependency found: " + ($bad -join ", "))
            exit 1
          }
          "no dynamic C/C++ runtime dependency in $exe"
      - name: e2e suite
        shell: pwsh
        run: ../scripts/e2e-windows.ps1 -Bin ./target/release/foton-handoff.exe
      - name: upload binary
        uses: actions/upload-artifact@v4
        with:
          name: foton-handoff-windows
          path: foton-handoff-src/target/release/foton-handoff.exe
          if-no-files-found: error
