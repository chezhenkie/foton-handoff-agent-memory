name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: foton-handoff
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: fmt
        run: cargo fmt --check
      - name: clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: unit tests
        run: cargo test
      - name: release build
        run: cargo build --release
      - name: e2e suite
        run: bash ../scripts/e2e-linux.sh ./target/release/foton-handoff
      - uses: actions/upload-artifact@v4
        with:
          name: foton-handoff-linux
          path: foton-handoff/target/release/foton-handoff

  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: foton-handoff
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: fmt
        run: cargo fmt --check
      - name: clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: unit tests
        run: cargo test
      - name: release build (static CRT)
        shell: pwsh
        env:
          RUSTFLAGS: "-C target-feature=+crt-static"
        run: cargo build --release
      - name: e2e suite
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File ..\scripts\e2e-windows.ps1 -Bin .\target\release\foton-handoff.exe
      - uses: actions/upload-artifact@v4
        with:
          name: foton-handoff-windows
          path: foton-handoff/target/release/foton-handoff.exe